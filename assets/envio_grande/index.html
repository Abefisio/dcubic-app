<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Seletor único "Enviar STL" (app.py): arrastar ou clicar, um ou vários arquivos .stl/.zip. Sem build:
     fala direto o protocolo de componentes do Streamlit (postMessage). Lê cada arquivo em fatias com
     File.slice e manda UMA por vez; só manda a seguinte quando o Python devolve o "ack" (próximo byte
     esperado) nos args. Vários arquivos vão um após o outro; ack = tamanho total libera o próximo.
     Fluxo: escolher/arrastar -> lista dos arquivos + botão "Importar" -> só então começa o envio, com o
     aviso "Loading…" piscando (e o texto de progresso) até o servidor terminar.
     Modo HTTP (args.modo = "http", DCUBIC_ENVIO_GRANDE=1 na VPS): até 3 GB por arquivo, partes de até
     32 MiB direto para o disco do servidor (modules/envio_http.py), com retomada, % e tempo estimado,
     SHA-256 por bloco e Cancelar que apaga o parcial. Sem esse argumento: o envio pelo websocket acima. -->
<style>
  body { margin: 0; font: 14px sans-serif; color: var(--texto, #e6edf6); background: transparent; }
  #zona { display: block; box-sizing: border-box; padding: 18px 12px; border-radius: 8px; cursor: pointer;
    border: 1px dashed rgba(250, 250, 250, .35); text-align: center; background: rgba(250, 250, 250, .04); }
  #zona:hover, #zona.sobre { border-color: var(--destaque, #00c2c9); color: var(--destaque, #00c2c9); }
  #zona b { display: block; margin-bottom: 4px; }
  #zona small { opacity: .75; }
  button { padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-top: 6px;
    border: 1px solid rgba(250, 250, 250, .2); background: transparent; color: inherit; font: inherit; }
  button:hover { border-color: var(--destaque, #00c2c9); color: var(--destaque, #00c2c9); }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  progress { width: 100%; height: 10px; accent-color: var(--destaque, #00c2c9); }
  button.primario { display: block; width: 100%; padding: 10px 12px; font-weight: 700; font-size: 15px;
    background: var(--destaque, #00c2c9); border-color: var(--destaque, #00c2c9); color: #06242a; }
  button.primario:hover { filter: brightness(1.1); color: #06242a; }
  #itens { margin: 6px 0 2px; padding-left: 18px; font-size: 13px; }
  #soma { font-size: 12px; opacity: .85; }
  .loading { font-weight: 700; color: var(--destaque, #00c2c9); animation: pisca 1s ease-in-out infinite; }
  @keyframes pisca { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .loading { animation: none; } }   /* aviso fixo, sem piscar */
  .rotulo { margin: 4px 0 2px; font-size: 12px; opacity: .85; }
  #txt { margin: 6px 0; font-size: 13px; opacity: .85; }
  .oculto { display: none !important; }
</style>
</head>
<body>
<label id="zona">
  <b>Arraste os arquivos aqui ou clique para escolher</b>
  <small>.stl ou .zip — um ou vários de uma vez</small>
  <input type="file" id="arq" accept=".stl,.zip" multiple>
</label>
<div id="lista" class="oculto">
  <b>Arquivos escolhidos</b>
  <ul id="itens"></ul>
  <div id="soma"></div>
  <button id="importar" type="button" class="primario">Importar</button>
  <button id="limpar" type="button">Cancelar</button>
</div>
<div id="andamento" class="oculto">
  <div id="aviso" class="loading" role="status">Loading…</div>
  <div class="rotulo" id="rot_arq"></div>
  <progress id="barra" max="1" value="0"></progress>
  <div class="rotulo" id="rot_total"></div>
  <progress id="barra_total" max="1" value="0"></progress>
  <button id="cancelar" type="button">Cancelar</button>
</div>
<div id="txt"></div>
<script>
// 16 MB do arquivo por mensagem (server.maxMessageSize do Streamlit = 200 MB): margem de 12 vezes.
// O .stl vai compactado (gzip nativo do navegador, ~6× menor); o .zip já é compactado e vai como está.
const PARTE = 16 * 1024 * 1024;
const GZ = typeof CompressionStream === "function";
const MB = 1024 * 1024;
let lote = null;       // {arqs, i (arquivo atual), feitos (bytes dos anteriores), total}
let envio = null;      // arquivo atual: {id, arq, ultimo, ini (fatia em voo), k (nº da tentativa), t (cão de guarda)}
let pend = null;       // arquivos escolhidos que esperam o clique em "Importar"
let limiteMb = 0;
const $ = (id) => document.getElementById(id);
const mb = (b) => (b / MB).toFixed(b < 10 * MB ? 1 : 0).replace(".", ",");

function falar(type, extra) { window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*"); }
function altura() { falar("streamlit:setFrameHeight", {height: document.body.scrollHeight + 4}); }
function texto(t) { $("txt").textContent = t; altura(); }
function mostrar(qual) {   // "zona" (escolher), "lista" (conferir e Importar) ou "andamento" (enviando)
  for (const id of ["zona", "lista", "andamento"]) $(id).classList.toggle("oculto", id !== qual);
  altura();
}
// altura do quadro sempre acompanha o conteúdo (texto que quebra linha não pode ficar cortado)
new ResizeObserver(altura).observe(document.body);
// nome e andamento do arquivo atual (e do total); chamado ANTES de ler a 1ª fatia: nunca fica em branco
function progresso(e, fim) {
  const n = lote.arqs.length, feito = lote.feitos + fim, tam = Math.max(e.arq.size, 1);
  $("barra").value = fim / tam;
  $("barra_total").value = feito / Math.max(lote.total, 1);
  $("rot_arq").textContent = `${n > 1 ? `Arquivo ${lote.i + 1} de ${n} — ` : ""}Enviando ${e.arq.name}: ` +
    `${mb(fim)} de ${mb(e.arq.size)} MB (${(100 * fim / tam).toFixed(0)}%)`;
  $("rot_total").textContent = `Total: ${mb(feito)} de ${mb(lote.total)} MB (${(100 * feito / Math.max(lote.total, 1)).toFixed(0)}%)`;
  $("rot_total").classList.toggle("oculto", n < 2);
  $("barra_total").classList.toggle("oculto", n < 2);
}

const FALHA_LEITURA = "Não foi possível ler o arquivo. Se ele estiver no iCloud/Google Drive, clique com o botão " +
  "direito no Finder > Baixar Agora e tente de novo.";

// lê (e compacta) a fatia que começa em ini; devolve uma promessa. NotReadableError (arquivo do
// iCloud/Drive ainda não baixado no computador, ou disco ocupado): tenta de novo até 3 vezes.
async function preparar(e, ini) {
  const pedaco = e.arq.slice(ini, Math.min(ini + PARTE, e.arq.size));
  const gz = GZ && !/\.zip$/i.test(e.arq.name);
  for (let tentativa = 0; ; tentativa++) {
    try {
      // lê primeiro, compacta depois: lido via stream()+Response, o NotReadableError vira um TypeError genérico
      let b = await pedaco.arrayBuffer();
      if (gz) b = await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
      return {ini, gz, dados: new Uint8Array(b)};
    } catch (err) {
      if (err.name !== "NotReadableError" || tentativa >= 3) throw err;
      await new Promise((r) => setTimeout(r, 1000 * (tentativa + 1)));
    }
  }
}

async function mandar(ini) {
  const e = envio;
  e.ini = ini;
  clearTimeout(e.t);
  const fim = Math.min(ini + PARTE, e.arq.size);
  progresso(e, ini);
  // a próxima fatia já foi lida/compactada enquanto a anterior viajava: aproveita
  const pronta = e.prox && e.prox.ini === ini ? e.prox.p : preparar(e, ini);
  e.prox = fim < e.arq.size ? {ini: fim, p: preparar(e, fim)} : null;
  if (e.prox) e.prox.p.catch(() => {});   // a falha é tratada quando essa fatia for usada
  let lida;
  try {
    lida = await pronta;
  } catch (err) {
    if (envio !== e) return;
    // para o "Loading…", mostra o motivo e deixa só o Cancelar (que apaga o parcial no servidor)
    e.falha = err.name === "NotReadableError" ? FALHA_LEITURA : `Não foi possível ler o arquivo (${err.name}).`;
    $("aviso").classList.remove("loading");
    $("aviso").textContent = "Envio interrompido.";
    texto(e.falha);
    return;
  }
  const {gz, dados} = lida;
  if (envio !== e) return;   // cancelado enquanto lia o disco
  const cab = new TextEncoder().encode(JSON.stringify(
    {id: e.id, nome: e.arq.name, total: e.arq.size, ini, gz, ultimo: e.ultimo, k: ++e.k}));   // k: cada envio é um valor novo
  const msg = new Uint8Array(4 + cab.length + dados.length);
  new DataView(msg.buffer).setUint32(0, cab.length, true);
  msg.set(cab, 4);
  msg.set(dados, 4 + cab.length);
  falar("streamlit:setComponentValue", {value: msg, dataType: "bytes"});
  progresso(e, fim);
  // o "Loading…" fica piscando até o servidor terminar: o quadro é trocado quando o dente abre
  $("aviso").textContent = fim >= e.arq.size && e.ultimo ? "Loading… preparando o arquivo no servidor" : "Loading…";
  // ponytail: sem resposta em 60 s, reenvia a mesma fatia (o Python ignora repetidas)
  e.t = setTimeout(() => envio === e && e.ini === ini && mandar(ini), 60000);
}

// ── Modo HTTP (DCUBIC_ENVIO_GRANDE=1, VPS): até 3 GB por arquivo, direto para o disco do servidor ──
// Partes de até 32 MiB (alinhadas a 1 MiB) por PUT em /dcubic-envio (modules/envio_http.py), com o
// SHA-256 de cada bloco de 1 MiB. Queda de conexão: espera, pergunta ao servidor quais blocos já
// chegaram e manda só os que faltam (escolher o mesmo arquivo de novo também retoma). O tamanho da
// parte acompanha a velocidade (~20 s por pedido: o proxy da VPS corta pedidos com mais de 60 s).
const BLOCO = MB, PARTE_MAX = 32 * MB, GB = 1024 * MB, PARALELO = 4;   // PARALELO: pedidos PUT ao mesmo tempo
let http = null;   // {token, limite} vindos do app
let ctl = null;    // envio HTTP em andamento: {ids (prontos), id (atual), cancelado, xhrs (pedidos em voo)}
const gb = (b) => (b / GB).toFixed(2).replace(".", ",");
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
const SESSAO = "Sua sessão expirou. Recarregue a página, entre de novo e escolha o mesmo arquivo: " +
  "o envio continua de onde parou.";

function req(metodo, caminho, corpo, cab, aoEnviar) {
  return new Promise((ok, falha) => {
    const x = new XMLHttpRequest(), erro = (status, msg) => Object.assign(new Error(msg), {status});
    x.open(metodo, "/dcubic-envio/" + caminho);
    x.setRequestHeader("X-DCubic-Token", http.token);
    for (const k in cab || {}) x.setRequestHeader(k, cab[k]);
    x.timeout = 180000;
    if (aoEnviar) x.upload.onprogress = (ev) => aoEnviar(ev.loaded / Math.max(ev.total, 1));
    x.onload = () => {
      let j = {};
      try { j = JSON.parse(x.responseText || "{}"); } catch (e) { /* resposta do proxy, sem JSON */ }
      if (x.status >= 200 && x.status < 300) ok(j);
      else falha(erro(x.status, j.erro || (x.status === 403 ? SESSAO : `Erro ${x.status} no servidor.`)));
    };
    x.onerror = x.ontimeout = () => falha(erro(0, "Sem conexão com o servidor."));
    x.onabort = () => falha(erro(-1, "cancelado"));
    if (ctl) { ctl.xhrs.add(x); x.addEventListener("loadend", () => ctl && ctl.xhrs.delete(x)); }
    x.send(corpo === undefined ? null : corpo);
  });
}
// repetir não adianta: cancelado, 4xx (exceto 408/429) e disco cheio (507); o resto (rede, 5xx) tenta de novo
const definitivo = (e) => e.status === -1 || e.status === 507 ||
  (e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429);

async function pausaRede(t) {
  const s = Math.min(30, 2 ** Math.min(t, 5));
  $("aviso").textContent = `Conexão interrompida — tentando de novo em ${s} s (o envio continua de onde parou).`;
  await Promise.race([esperar(s * 1000), new Promise((r) => window.addEventListener("online", r, {once: true}))]);
  if (!navigator.onLine) await new Promise((r) => window.addEventListener("online", r, {once: true}));
  $("aviso").textContent = "Loading…";
}
async function comRetomada(fn) {   // pedidos pequenos (JSON): repete enquanto a conexão não volta
  for (let t = 0; ; t++) {
    try { return await fn(); }
    catch (e) { if (definitivo(e) || t >= 40) throw e; await pausaRede(t); }
  }
}

async function lerFaixa(arq, a, z) {   // NotReadableError (iCloud/Drive não baixado): até 3 novas tentativas
  for (let t = 0; ; t++) {
    try { return await arq.slice(a, z).arrayBuffer(); }
    catch (err) { if (err.name !== "NotReadableError" || t >= 3) throw err; await esperar(1000 * (t + 1)); }
  }
}
async function prepararFaixa(arq, b, e, gz) {   // blocos [b, e): bytes, SHA-256 por bloco e (opcional) gzip
  const buf = await lerFaixa(arq, b * BLOCO, Math.min(e * BLOCO, arq.size)), shas = [];
  for (let i = 0; i < buf.byteLength; i += BLOCO)
    shas.push(hex(await crypto.subtle.digest("SHA-256", new Uint8Array(buf, i, Math.min(BLOCO, buf.byteLength - i)))));
  let corpo = buf, zip = false;
  if (gz) {   // só vai compactada se encolher de verdade (>= 8%): senão economiza também o gunzip do servidor
    const c = await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    if (c.byteLength < 0.92 * buf.byteLength) { corpo = c; zip = true; }
  }
  return {b, e, shas, corpo, zip, bytes: buf.byteLength};
}
function faixa(tem, de, nb) {   // primeiro trecho que falta a partir de `de`, com até nb blocos seguidos
  const b = tem.indexOf(0, de);
  if (b < 0) return null;
  let e = b + 1;
  while (e < tem.length && e - b < nb && tem[e] === 0) e++;
  return [b, e];
}
const tempo = (s) => s < 60 ? `~${Math.max(1, Math.ceil(s))} s` : s < 3600 ? `~${Math.floor(s / 60)} min ${Math.round(s % 60)} s`
  : `~${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`;
function mostrarHttp(arq, feito, vel, acao) {
  const n = lote.arqs.length, tam = Math.max(arq.size, 1), total = lote.feitos + feito;
  $("barra").value = feito / tam;
  $("barra_total").value = total / Math.max(lote.total, 1);
  $("rot_arq").textContent = `${n > 1 ? `Arquivo ${lote.i + 1} de ${n} — ` : ""}${acao || "Enviando"} ${arq.name}: ` +
    `${mb(feito)} de ${mb(arq.size)} MB (${(100 * feito / tam).toFixed(0)}%)` +
    (vel > 0 ? ` — ${mb(vel)} MB/s — faltam ${tempo((lote.total - total) / vel)}` : "");
  $("rot_total").textContent = `Total: ${mb(total)} de ${mb(lote.total)} MB (${(100 * total / Math.max(lote.total, 1)).toFixed(0)}%)`;
  $("rot_total").classList.toggle("oculto", n < 2);
  $("barra_total").classList.toggle("oculto", n < 2);
}

async function enviarArquivoHttp(arq) {
  const c = ctl, gz = GZ && !/\.zip$/i.test(arq.name);
  mostrarHttp(arq, 0, 0, "Preparando");
  const ini = await comRetomada(() => req("POST", "iniciar",
    JSON.stringify({nome: arq.name, total: arq.size, chave: `${arq.name}|${arq.size}|${arq.lastModified}`}),
    {"Content-Type": "application/json"}));
  c.id = ini.id;
  let tem = Uint8Array.from(ini.mapa, (ch) => ch === "1" ? 1 : 0);
  const n = tem.length, shas = new Array(n).fill("");   // "" = ainda sem hash (every() pularia buracos)
  const feitos = () => { let s = 0; for (let k = 0; k < n; k++) if (tem[k] === 1) s += Math.min(BLOCO, arq.size - k * BLOCO); return s; };
  let nb = 4, vel = 0, falhas = 0, rec = null;   // partes de 4 MiB no início; o tamanho acompanha a velocidade
  const voo = new Map(), amostras = [];            // bytes já enviados de cada parte em voo; (instante, bytes) p/ MB/s
  const velTotal = () => {                          // velocidade do conjunto: janela dos últimos ~15 s
    const agora = performance.now(), feito = feitos() + [...voo.values()].reduce((a, b) => a + b, 0);
    amostras.push([agora, feito]);
    while (amostras.length > 2 && agora - amostras[0][0] > 15000) amostras.shift();
    const [t0, b0] = amostras[0];
    return agora - t0 > 1500 ? (feito - b0) / ((agora - t0) / 1000) : 0;
  };
  const andamento = () => mostrarHttp(arq, feitos() + [...voo.values()].reduce((a, b) => a + b, 0), velTotal());
  // Recuperação de queda: UMA espera e UMA consulta ao servidor, mesmo que várias partes falhem juntas.
  const recuperar = () => rec || (rec = (async () => {
    nb = Math.max(1, nb >> 1);   // conexão lenta/instável: partes menores
    await pausaRede(falhas++);
    // o servidor diz o que chegou (blocos completos ficam marcados mesmo com a queda no meio da parte)
    const m = (await comRetomada(() => req("GET", c.id))).mapa;
    for (let k = 0; k < n; k++) if (m[k] === "1" && tem[k] !== 2) tem[k] = 1;
    rec = null;
  })());
  // Cada trabalhador pega o primeiro trecho ainda sem dono (tem = 0; 2 = em voo), prepara e envia.
  async function trabalhador(w) {
    for (;;) {
      if (c.cancelado || c.parar) return;
      const f = faixa(tem, 0, nb);
      if (!f) return;
      const [b, e] = f;
      tem.fill(2, b, e);
      try {
        const p = await prepararFaixa(arq, b, e, gz);
        p.shas.forEach((h, j) => { shas[b + j] = h; });
        const ts = performance.now();
        await req("PUT", `${c.id}?ini=${b * BLOCO}`, p.corpo,
                  {"X-DCubic-Sha": p.shas.join(","), ...(p.zip ? {"X-DCubic-Gz": "1"} : {})},
                  (fr) => { voo.set(w, fr * p.bytes); andamento(); });
        voo.delete(w);
        tem.fill(1, b, e);
        const v = p.bytes / Math.max((performance.now() - ts) / 1000, 0.05);   // desta parte (compartilhando a banda)
        vel = vel ? 0.7 * vel + 0.3 * v : v;
        nb = Math.max(1, Math.min(PARTE_MAX / BLOCO, Math.floor(vel * 20 / BLOCO)));
        falhas = 0;
        andamento();
      } catch (err) {
        voo.delete(w);
        for (let k = b; k < e; k++) if (tem[k] === 2) tem[k] = 0;   // devolve o trecho: outra volta o reenvia
        if (c.cancelado || c.parar || definitivo(err) || falhas >= 40) throw err;
        await recuperar();
      }
    }
  }
  for (;;) {
    if (c.cancelado) throw Object.assign(new Error("cancelado"), {status: -1});
    if (tem.includes(0)) {   // há o que enviar (início, ou trechos devolvidos após uma queda)
      const ts = Array.from({length: PARALELO}, (_, w) => trabalhador(w));
      try { await Promise.all(ts); }
      catch (err) { c.parar = true; c.xhrs.forEach((x) => x.abort()); await Promise.allSettled(ts); throw err; }
      continue;
    }
    // tudo no servidor: hash composto (relê do computador os blocos que já estavam lá na retomada)
    for (let k = 0; k < n; k += 32) {
      if (shas.slice(k, Math.min(k + 32, n)).every(Boolean)) continue;
      mostrarHttp(arq, k * BLOCO, 0, "Conferindo");
      (await prepararFaixa(arq, k, Math.min(k + 32, n), false)).shas.forEach((h, j) => { shas[k + j] = h; });
    }
    mostrarHttp(arq, arq.size, 0, "Conferindo no servidor (tamanho e SHA-256)");
    const comp = hex(await crypto.subtle.digest("SHA-256", Uint8Array.from(shas.join("").match(/../g), (h) => parseInt(h, 16))));
    const r = await comRetomada(() => req("POST", `${c.id}/concluir`, JSON.stringify({hash: comp}), {"Content-Type": "application/json"}));
    if (r.ok) return c.id;
    tem = Uint8Array.from(r.mapa, (ch) => ch === "1" ? 1 : 0);   // bloco que não conferiu no disco: reenvia
  }
}

async function enviarLoteHttp() {
  const c = ctl = {ids: [], id: null, cancelado: false, xhrs: new Set()};
  try {
    for (lote.i = 0; lote.i < lote.arqs.length; lote.i++) {
      c.ids.push(await enviarArquivoHttp(lote.arqs[lote.i]));
      c.id = null;
      lote.feitos += lote.arqs[lote.i].size;
    }
    $("aviso").textContent = "Loading… preparando o arquivo no servidor";
    falar("streamlit:setComponentValue", {value: {prontos: c.ids, n: Date.now()}, dataType: "json"});
  } catch (err) {
    if (ctl !== c || err.status === -1) return;   // cancelado
    // volta à escolha: o que já chegou fica no servidor por 24 h e o mesmo arquivo retoma de onde parou
    ctl = lote = null;
    mostrar("zona");
    texto("Envio interrompido. " + (err.name === "NotReadableError" ? FALHA_LEITURA
      : !crypto.subtle ? "O envio grande exige o endereço seguro (https://) do app."
      : err.message + (c.id ? " O que já foi enviado fica guardado por 24 h: escolha o mesmo arquivo de novo " +
        "para continuar de onde parou." : "")));
  }
}

function cancelarHttp() {   // interrompe e apaga, no servidor, o parcial e os arquivos já prontos deste lote
  const c = ctl;
  ctl = null;
  c.cancelado = true;
  c.xhrs.forEach((x) => x.abort());
  for (const id of [...c.ids, c.id].filter(Boolean)) {
    const x = new XMLHttpRequest();
    x.open("DELETE", "/dcubic-envio/" + id);
    x.setRequestHeader("X-DCubic-Token", http.token);
    x.send();
  }
}

function proximo() {
  if (envio) { clearTimeout(envio.t); lote.feitos += envio.arq.size; }
  const arq = lote.arqs[++lote.i];
  envio = {id: Math.random().toString(36).slice(2) + Date.now().toString(36), arq,
           ultimo: lote.i === lote.arqs.length - 1, ini: -1, k: 0, t: 0};
  mandar(0);
}

function escolher(lista) {
  const arqs = Array.from(lista || []);
  if (!arqs.length || lote) return;
  const ruim = arqs.find((a) => !/\.(stl|zip)$/i.test(a.name));
  if (ruim) return texto(`"${ruim.name}" não é .stl nem .zip. Escolha arquivos .stl ou .zip.`);
  const lim = http ? http.limite : limiteMb * MB;
  const grande = lim && arqs.find((a) => a.size > lim);
  if (grande) return texto(http
    ? `"${grande.name}" tem ${gb(grande.size)} GB e passa do limite de ${Math.round(lim / GB)} GB por arquivo ` +
      `(${lim.toLocaleString("pt-BR")} bytes).`
    : `"${grande.name}" tem ${mb(grande.size)} MB e passa do limite de ${limiteMb} MB por arquivo.`);
  pend = arqs;
  $("itens").replaceChildren(...arqs.map((a) => Object.assign(document.createElement("li"), {textContent: `${a.name} — ${mb(a.size)} MB`})));
  $("soma").textContent = `${arqs.length} arquivo(s), ${mb(arqs.reduce((s, a) => s + a.size, 0))} MB no total. Nada foi enviado ainda.`;
  texto("");
  mostrar("lista");
}

$("importar").addEventListener("click", () => {
  if (!pend || lote) return;
  lote = {arqs: pend, i: -1, feitos: 0, total: pend.reduce((s, a) => s + a.size, 0)};
  pend = null;
  $("aviso").textContent = "Loading…";
  $("aviso").classList.add("loading");
  texto("");
  mostrar("andamento");
  if (http) enviarLoteHttp();
  else proximo();
});
$("limpar").addEventListener("click", () => { pend = null; texto(""); mostrar("zona"); });

$("arq").addEventListener("change", () => {
  const arqs = Array.from($("arq").files);
  $("arq").value = "";
  escolher(arqs);
});

// Arrastar e soltar: em todo o quadro (soltar fora da zona não abre o arquivo no navegador).
document.addEventListener("dragover", (ev) => { ev.preventDefault(); $("zona").classList.add("sobre"); });
document.addEventListener("dragleave", () => $("zona").classList.remove("sobre"));
document.addEventListener("drop", (ev) => {
  ev.preventDefault();
  $("zona").classList.remove("sobre");
  escolher(ev.dataTransfer && ev.dataTransfer.files);
});

$("cancelar").addEventListener("click", () => {
  if (http && ctl) cancelarHttp();
  else if (!envio) return;
  else {
    clearTimeout(envio.t);
    falar("streamlit:setComponentValue", {value: {cancelar: envio.id}, dataType: "json"});
  }
  envio = lote = null;
  mostrar("zona");
  texto("Envio cancelado.");
});

window.addEventListener("message", (ev) => {
  if (ev.data.type !== "streamlit:render") return;
  const a = ev.data.args || {}, tema = ev.data.theme;
  if (tema) {
    document.body.style.setProperty("--texto", tema.textColor);
    document.body.style.setProperty("--destaque", tema.primaryColor);
  }
  limiteMb = a.limite_mb || 0;
  http = a.modo === "http" ? {token: a.token, limite: a.limite_bytes || 0} : null;
  // ack = próximo byte que o Python espera; igual à fatia em voo = ainda não processada (espera)
  if (envio && a.id === envio.id && a.ack !== envio.ini) {
    if (a.ack < envio.arq.size) mandar(a.ack);
    else if (!envio.ultimo) proximo();   // arquivo completo no servidor: manda o próximo do lote
  }
  altura();
});

falar("streamlit:componentReady", {apiVersion: 1});
altura();
</script>
</body>
</html>
