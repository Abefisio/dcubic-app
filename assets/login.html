<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{font-family:'Inter',sans-serif;background:transparent;color:#c3d1e6}
 .row{display:flex;align-items:center;gap:20px;justify-content:center;padding:6px 0 4px}
 .v{width:118px;height:118px;border:1px solid #1c2c56;border-radius:12px;background:linear-gradient(160deg,#030826,#01030f);overflow:hidden;flex:0 0 auto}
 video{width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(circle at 50% 48%,#000 60%,transparent 92%);mask-image:radial-gradient(circle at 50% 48%,#000 60%,transparent 92%)}
 .t h2{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
 .t .s{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#00c2c9;margin-top:5px}
 .t p{font-size:14px;color:#9fb2cc;margin-top:9px}
 @media(max-width:640px){.t h2{font-size:20px}.v{width:96px;height:96px}}
</style></head>
<body>
 <div class="row">
  <div class="v"><video autoplay muted loop playsinline>__SRC__</video></div>
  <div class="t"><h2>DCubic Image System</h2><div class="s">USP / FOUSP · MICRO-CT</div><p>Faça login para acessar a plataforma.</p></div>
 </div>
</body></html>
